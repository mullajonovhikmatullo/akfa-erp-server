services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Tashkent}
      PGTZ: ${TZ:-Asia/Tashkent}
    volumes:
      - /srv/erp-pos/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-60000}
      DB_TRANSACTION_MAX_WAIT_MS: ${DB_TRANSACTION_MAX_WAIT_MS:-10000}
      DB_TRANSACTION_TIMEOUT_MS: ${DB_TRANSACTION_TIMEOUT_MS:-60000}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-120000}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-60000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-75000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PLATFORM_OWNER_USERNAME: ${PLATFORM_OWNER_USERNAME}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD}
      PLATFORM_OWNER_FULL_NAME: ${PLATFORM_OWNER_FULL_NAME:-Platform Owner}
      PLATFORM_OWNER_ALLOW_WEAK_PASSWORD: ${PLATFORM_OWNER_ALLOW_WEAK_PASSWORD:-0}
      PUBLIC_UPLOAD_BASE_URL: /api/uploads
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      STORAGE_CONNECTION_TIMEOUT_MS: ${STORAGE_CONNECTION_TIMEOUT_MS:-5000}
      STORAGE_REQUEST_TIMEOUT_MS: ${STORAGE_REQUEST_TIMEOUT_MS:-30000}
      UPLOAD_ROOT: /srv/erp-pos/media
      PRODUCT_IMAGE_MAX_SIZE_MB: ${PRODUCT_IMAGE_MAX_SIZE_MB:-5}
      PRODUCT_IMAGE_MAX_COUNT: ${PRODUCT_IMAGE_MAX_COUNT:-5}
      PRODUCT_IMAGE_CONCURRENT_UPLOADS: ${PRODUCT_IMAGE_CONCURRENT_UPLOADS:-2}
      PROFILE_PHOTO_CONCURRENT_UPLOADS: ${PROFILE_PHOTO_CONCURRENT_UPLOADS:-2}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
    volumes:
      - /srv/erp-pos/media:/srv/erp-pos/media
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
